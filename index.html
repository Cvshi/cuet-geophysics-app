<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>CUET PG Geophysics V6</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--txt:#172033;--muted:#687386;--a:#315efb;--line:#e2e7ef;--g:#16845a;--r:#c43b43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif}header{background:#111827;color:#fff;padding:19px 15px}header h1{margin:0;font-size:21px}header p{margin:4px 0;color:#cbd5e1;font-size:13px}nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:9px;position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line)}button,select{font:inherit}button{cursor:pointer}nav button,.btn,.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;white-space:nowrap}nav button.active,.primary{background:var(--a);color:#fff;border-color:var(--a)}main{max-width:1080px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.metric{font-size:25px;font-weight:800}.muted{color:var(--muted);font-size:13px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mode{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}.mode strong{display:block}.mode small{color:var(--muted)}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.filters select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.badge{display:inline-block;background:#eef2ff;color:#2949c7;border-radius:99px;padding:4px 9px;font-size:12px}.answer{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:7px 0}.answer.correct{background:#edf9f3;border-color:var(--g)}.answer.wrong{background:#fff0f1;border-color:var(--r)}.feedback{padding:12px;background:#f1f5f9;border-radius:12px;margin-top:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.barbg{height:9px;background:#e9edf5;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--a)}.list{padding:11px 0;border-bottom:1px solid var(--line)}.hidden{display:none}.timer{font-size:24px;font-weight:800}.small{font-size:12px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.modes{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>CUET PG Geophysics — V6</h1><p>600-question bank • High-volume practice • Adaptive review</p></header>
<nav><button class="active" data-page="home">🏠 Home</button><button data-page="practice">🎯 Practice</button><button data-page="mistakes">🧠 Mistakes</button><button data-page="syllabus">📚 Syllabus</button><button data-page="stats">📊 Stats</button></nav>
<main>
<section id="home" class="page active"><div class="grid"><div class="card"><div class="muted">Question bank</div><div class="metric" id="bankN">…</div></div><div class="card"><div class="muted">Solved</div><div class="metric" id="solved">0</div></div><div class="card"><div class="muted">Accuracy</div><div class="metric" id="accuracy">—</div></div><div class="card"><div class="muted">Mistakes</div><div class="metric" id="mistakes">0</div></div></div>
<div class="card"><h2>⚡ High-volume practice</h2><div class="modes"><button class="mode" onclick="openPractice(10)"><strong>⚡ 10</strong><small>Quick</small></button><button class="mode" onclick="openPractice(25)"><strong>🔥 25</strong><small>Standard</small></button><button class="mode" onclick="openPractice(50)"><strong>💪 50</strong><small>Marathon</small></button><button class="mode" onclick="openPractice(100)"><strong>🚀 100</strong><small>Deep</small></button><button class="mode" onclick="openPractice(200)"><strong>🧨 200</strong><small>Extreme</small></button><button class="mode" onclick="openPractice(0)"><strong>♾️ Infinite</strong><small>Until you stop</small></button></div></div>
<div class="card"><h2>🎛️ Targeted engine</h2><div class="filters"><select id="subject"><option>All subjects</option><option>Mechanics & Waves</option><option>Electromagnetism</option><option>Optics</option><option>Electronics</option></select><select id="topic"><option>All topics</option></select><select id="type"><option>All types</option><option>Concept</option><option>Numerical</option><option>Formula</option></select><select id="difficulty"><option>All difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select><select id="modeSelect"><option>Mixed</option><option>New</option><option>Weak</option><option>Mistakes</option></select></div><button class="btn primary" style="margin-top:10px" onclick="customPractice()">Start filtered practice</button></div>
<div class="grid2"><div class="card"><h3>Today's recommendation</h3><p id="recommend"></p></div><div class="card"><h3>Revision due</h3><p id="due"></p></div></div></section>
<section id="practice" class="page"><div class="card"><div class="row"><span><span class="badge" id="pmeta"></span> <span class="badge" id="pdiff"></span></span><span><span class="timer" id="timer">00:00</span> <span id="count"></span></span></div><div class="barbg" style="margin:10px 0"><div class="bar" id="pbar"></div></div><h2 id="question"></h2><div id="answers"></div><div id="feedback"></div><div id="confidence" class="hidden"><p><b>Confidence?</b></p><button class="chip" onclick="setConfidence(1)">1</button><button class="chip" onclick="setConfidence(2)">2</button><button class="chip" onclick="setConfidence(3)">3</button><button class="chip" onclick="setConfidence(4)">4</button><button class="chip" onclick="setConfidence(5)">5</button></div><button class="btn primary hidden" id="next" onclick="nextQ()">Next →</button> <button class="btn hidden" id="stop" onclick="endSession()">Stop</button></div></section>
<section id="mistakes" class="page"><div class="card"><h2>🧠 Mistake Bank</h2><div id="mistakeList"></div></div></section>
<section id="syllabus" class="page"><div class="card"><h2>📚 Syllabus</h2><div id="syllabusList"></div></div></section>
<section id="stats" class="page"><div class="card"><h2>📊 Performance</h2><div id="statsList"></div></div></section>
</main>
<script>
let BANK=[];let state=JSON.parse(localStorage.getItem("cuetGeoV6")||localStorage.getItem("cuetGeoV5")||'{"solved":0,"correct":0,"mistakes":[],"confidence":[],"history":[],"status":{},"sessions":[]}');localStorage.setItem("cuetGeoV6",JSON.stringify(state));
const SY={"Mechanics & Waves":["Galilean invariance & frames","Equivalence principle","Pseudo force & Coriolis","Planetary motion & Kepler","Gravitational potential","Momentum & rocket equation","Moment of inertia & rolling","Angular momentum","Beats & Lissajous","LCR & resonance","Fourier series"],"Electromagnetism":["Maxwell equations & EM waves","Displacement current","Travelling waves","Coaxial cable fields","Poynting vector","EM propagation"],"Optics":["Newton's rings","Michelson interferometer","Coherence","LASER","Fresnel diffraction","Fraunhofer diffraction","Polarisation","Brewster's law","Optic axis","Nicol prism","Huygens double diffraction"],"Electronics":["Semiconductors","P-N junction","Transistor","Rectifiers & filters","Common-emitter amplifier"]};
let queue=[],pos=0,target=10,answered=false,startTime=0,timer=null;
async function loadBank(){try{let r=await fetch("questions.json",{cache:"no-store"});BANK=await r.json();populateTopics();render()}catch(e){document.getElementById("bankN").textContent="Error";document.getElementById("recommend").textContent="questions.json is missing. Upload all V6 files."}}
function save(){localStorage.setItem("cuetGeoV6",JSON.stringify(state));render()}
function show(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===id));render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.page));document.getElementById("subject").onchange=populateTopics;
function populateTopics(){let s=document.getElementById("subject").value,ts=[...new Set(BANK.filter(q=>s==="All subjects"||q.subject===s).map(q=>q.topic))].sort();document.getElementById("topic").innerHTML='<option>All topics</option>'+ts.map(t=>`<option>${t}</option>`).join("")}
function rate(s){let h=state.history.filter(x=>x.subject===s);return h.length?h.filter(x=>x.correct).length/h.length:0}
function filtered(){let s=document.getElementById("subject").value,t=document.getElementById("topic").value,ty=document.getElementById("type").value,d=document.getElementById("difficulty").value,m=document.getElementById("modeSelect").value;let p=BANK.filter(q=>(s==="All subjects"||q.subject===s)&&(t==="All topics"||q.topic===t)&&(ty==="All types"||q.type===ty)&&(d==="All difficulty"||q.difficulty===d));if(m==="Weak")p.sort((a,b)=>rate(a.subject)-rate(b.subject));if(m==="New")p=p.filter(q=>!state.history.some(h=>h.id===q.id));if(m==="Mistakes")p=p.filter(q=>state.mistakes.some(x=>x.id===q.id));return p.length?p:BANK}
function makeQueue(pool,n){pool=[...pool].sort(()=>Math.random()-.5);if(!n)return pool;let out=[];while(out.length<n)out.push(...pool);return out.slice(0,n)}
function openPractice(n){target=n;queue=makeQueue(BANK,n);startSession()}
function customPractice(){let n=+prompt("How many questions? Enter 10–500, or 0 for infinite.","25");if(!Number.isFinite(n)||n<0||n>500)return;target=n;queue=makeQueue(filtered(),n);startSession()}
function startSession(){if(!BANK.length)return;pos=0;answered=false;startTime=Date.now();clearInterval(timer);timer=setInterval(()=>{let s=Math.floor((Date.now()-startTime)/1000);document.getElementById("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000);document.getElementById("stop").classList.remove("hidden");show("practice");loadQ()}
function loadQ(){let q=queue[pos%queue.length];answered=false;document.getElementById("pmeta").textContent=q.subject+" • "+q.topic;document.getElementById("pdiff").textContent=q.difficulty+" • "+q.type;document.getElementById("count").textContent=target?`${pos+1}/${target}`:`${pos+1}`;document.getElementById("pbar").style.width=target?Math.min(100,pos/target*100)+"%":"100%";document.getElementById("question").textContent=q.question;document.getElementById("answers").innerHTML=q.options.map((a,i)=>`<button class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join("");document.getElementById("feedback").innerHTML="";document.getElementById("confidence").classList.add("hidden");document.getElementById("next").classList.add("hidden")}
function answer(i){if(answered)return;answered=true;let q=queue[pos%queue.length],ok=i===q.answer;state.solved++;if(ok)state.correct++;state.history.push({id:q.id,subject:q.subject,topic:q.topic,type:q.type,difficulty:q.difficulty,correct:ok,date:Date.now()});if(!ok)state.mistakes.unshift({id:q.id,subject:q.subject,topic:q.topic,question:q.question,your:q.options[i],correct:q.options[q.answer],explanation:q.explanation,due:Date.now()+86400000});document.querySelectorAll(".answer").forEach((b,j)=>{if(j===q.answer)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});document.getElementById("feedback").innerHTML=`<div class="feedback"><b>${ok?"Correct!":"Incorrect."}</b> ${q.explanation}<div class="small muted">Family: ${q.family} • Original practice item</div></div>`;document.getElementById("confidence").classList.remove("hidden");save()}
function setConfidence(v){state.confidence.push(v);document.getElementById("confidence").classList.add("hidden");document.getElementById("next").classList.remove("hidden");save()}
function nextQ(){if(target&&pos+1>=target){endSession();return}pos++;loadQ()}
function endSession(){clearInterval(timer);state.sessions.push({questions:pos+(answered?1:0),duration:Math.floor((Date.now()-startTime)/1000),date:Date.now()});save();alert("Session complete!");show("home")}
function render(){let acc=state.solved?Math.round(state.correct/state.solved*100):0,all=Object.values(SY).flat(),mastery=Math.round(all.reduce((n,t)=>n+(state.status[t]||0),0)/(all.length*4)*100),due=state.mistakes.filter(x=>x.due<=Date.now()).length;document.getElementById("bankN").textContent=BANK.length?BANK.length.toLocaleString():"…";document.getElementById("solved").textContent=state.solved;document.getElementById("accuracy").textContent=state.solved?acc+"%":"—";document.getElementById("mistakes").textContent=state.mistakes.length;document.getElementById("due").textContent=`${due} revision item(s) due now • ${state.mistakes.length} total mistakes`;document.getElementById("recommend").textContent=due?`Review ${due} due mistake(s), then do a 25-question weak-area session.`:`Start a 25-question mixed session. Aim for accuracy first, then speed.`;document.getElementById("mistakeList").innerHTML=state.mistakes.length?state.mistakes.map((m,i)=>`<div class="list"><b>${m.subject} • ${m.topic}</b><p>${m.question}</p><span class="muted">Your: ${m.your}<br>Correct: ${m.correct}</span><p>${m.explanation}</p><button class="btn" onclick="removeMistake(${i})">Reviewed</button></div>`).join(""):"<p class='muted'>No mistakes yet.</p>";let sl="";for(let [s,ts] of Object.entries(SY)){sl+=`<h3>${s}</h3>`;ts.forEach(t=>{let v=state.status[t]||0;sl+=`<div class="list row"><span>${t}</span><select onchange="setStatus('${t.replace(/'/g,"\\'")}',this.value)">${["Not started","Learning","Practicing","Strong","Mastered"].map((x,i)=>`<option value="${i}" ${i===v?"selected":""}>${x}</option>`).join("")}</select></div>`})}document.getElementById("syllabusList").innerHTML=sl;document.getElementById("statsList").innerHTML=`<div class="list row"><span>Question bank</span><b>${BANK.length}</b></div><div class="list row"><span>Questions solved</span><b>${state.solved}</b></div><div class="list row"><span>Accuracy</span><b>${state.solved?acc+"%":"—"}</b></div><div class="list row"><span>Mastery</span><b>${mastery}%</b></div><div class="list row"><span>Mistake bank</span><b>${state.mistakes.length}</b></div><div class="list row"><span>Average confidence</span><b>${state.confidence.length?(state.confidence.reduce((a,b)=>a+b,0)/state.confidence.length).toFixed(1)+"/5":"—"}</b></div><div class="list row"><span>Sessions</span><b>${state.sessions.length}</b></div>`}
function setStatus(t,v){state.status[t]=+v;save()}function removeMistake(i){state.mistakes.splice(i,1);save()}
loadBank();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
